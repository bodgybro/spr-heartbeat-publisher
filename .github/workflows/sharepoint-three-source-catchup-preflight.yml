name: Preflight SharePoint three-source catch-up (no production changes)
on:
  push:
    branches:
      - feature/sharepoint-three-source-catchup-20261123
    paths:
      - .github/workflows/sharepoint-three-source-catchup-preflight.yml
      - railway/sharepoint_auto_catchup_patch_20261123.py
      - railway/tests/test_sharepoint_auto_catchup_20261123.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fixture tests and syntax checks (does not contact Railway)
        run: |
          set -euo pipefail
          python3 -m py_compile railway/sharepoint_auto_catchup_patch_20261123.py
          python3 railway/tests/test_sharepoint_auto_catchup_20261123.py
          echo SHAREPOINT_THREE_SOURCE_CATCHUP_PREFLIGHT_SUCCESS
